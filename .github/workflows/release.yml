name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lonewolfyx-workflows/npm-public-actions@main
        with:
          package-manager: pnpm

      - run: pnpm run git:release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
